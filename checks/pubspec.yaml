# The audits that decide whether a plugin holds this framework's contract.
#
# A SECOND PACKAGE and not part of the framework's own library, for a reason the framework's own
# check states: exec-confinement forbids dart:io outside infrastructure/, and it scopes that rule to
# the SHIPPED library — lib/src/testing/ is deliberately not exempt, "because it ships". An audit
# walks a tree of files, so it needs dart:io, and putting it in the shipped library would mean
# widening the one rule that keeps a step from leaving the framework.
#
# So it lives beside the framework and is a DEV dependency of whatever uses it. It is development
# tooling: it is never compiled into a binary and never carried onto a machine, so no run passes
# through it and no dry-run guarantee rests on it.
#
# The direction is the same one the framework insists on everywhere else: this depends on the
# framework, the framework depends on nothing.
name: ansiwise_checks
description: The audits that decide whether a plugin holds the ansiwise contract.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.12.0

dependencies:
  # The registry, the steps and the three modes an audit drives, plus the fakes it drives them
  # against — a step under probe meets a fake machine, not a real one.
  ansiwise_api:
    path: ..
  path: ^1.9.1

dev_dependencies:
  test: ^1.31.2
  lints: ^6.1.0
